#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - iptables
  - jq
  - snapd
  - unzip

write_files:
  - path: /etc/clouddeploy/config.json
    owner: root:root
    permissions: '0600'
    content: |
      ${settings}
  - path: /etc/rancher/k3s/config.yaml
    owner: root:root
    permissions: '0600'
    content: |
      write-kubeconfig-mode: "0600"
      disable:
        - traefik
        - servicelb
  - path: /usr/local/bin/clouddeploy-bootstrap
    owner: root:root
    permissions: '0700'
    content: |
      ${bootstrap}
  - path: /usr/local/bin/clouddeploy-deploy
    owner: root:root
    permissions: '0700'
    content: |
      ${deploy}
  - path: /usr/local/bin/clouddeploy-rollback
    owner: root:root
    permissions: '0700'
    content: |
      ${rollback}
  - path: /usr/local/bin/clouddeploy-smoke-test
    owner: root:root
    permissions: '0700'
    content: |
      ${smoke}

runcmd:
  - [ /usr/local/bin/clouddeploy-bootstrap, "${version}" ]
